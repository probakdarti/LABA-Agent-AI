name: DeskVac – build Windows

on:
  push:
    paths:
      - "deskvac/**"
      - ".github/workflows/deskvac.yml"
  workflow_dispatch:

env:
  DESKVAC_VERSION: "0.5.${{ github.run_number }}"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (jeden plik .exe, bez instalowania .NET)
        run: >
          dotnet publish deskvac/DeskVac/DeskVac.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.DESKVAC_VERSION }}
          -o out

      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:DESKVAC_VERSION" deskvac\installer\DeskVac.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalator DeskVac-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: DeskVac-Setup
          path: out/DeskVac-Setup.exe
          if-no-files-found: error

      - name: Wersja przenośna DeskVac.exe
        uses: actions/upload-artifact@v4
        with:
          name: DeskVac-portable-win-x64
          path: out/DeskVac.exe
          if-no-files-found: error
