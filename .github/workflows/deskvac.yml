name: DeskVac – build Windows

on:
  push:
    paths:
      - "deskvac/**"
      - ".github/workflows/deskvac.yml"
  workflow_dispatch:

# minimalne uprawnienia tokenu GITHUB_TOKEN: budowanie potrzebuje tylko odczytu repozytorium
permissions:
  contents: read

env:
  DESKVAC_VERSION: "2.1.${{ github.run_number }}"
  # Podpis cyfrowy jest OBOWIĄZKOWY: bez sekretów SIGNING_PFX_BASE64 i SIGNING_PFX_PASSWORD build się nie uda.
  # Certyfikat w sekrecie musi być tym samym, co publiczny deskvac/signing/VERME.cer (porównanie odcisku SHA-1).
  CERT_FILE: deskvac/signing/VERME.cer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Testy automatyczne – jeśli któryś nie przejdzie, instalator nie powstanie
      - name: Testy automatyczne
        run: dotnet test deskvac/DeskVac.Tests/DeskVac.Tests.csproj -c Release --logger "console;verbosity=normal"

      # Aplikacja jako zwykły folder (nie „samorozpakowujący się” jeden plik, bez kompresji) –
      # pakiety antywirusowe znacznie rzadziej biorą takie programy za podejrzane.
      - name: Publish
        run: >
          dotnet publish deskvac/DeskVac/DeskVac.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.DESKVAC_VERSION }}
          -o out/app

      - name: Certyfikat do podpisu
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PASS)) {
            Write-Error "Brak sekretów SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD (Settings → Secrets and variables → Actions). Bez podpisu wersja nie powstaje."
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PASS)
          if (-not $cert.HasPrivateKey) { Write-Error "Plik .pfx nie zawiera klucza prywatnego."; exit 1 }
          $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path $env:CERT_FILE).Path)).Thumbprint
          if ($cert.Thumbprint -ne $expected) {
            Write-Error "Certyfikat z sekretu ($($cert.Thumbprint)) nie jest certyfikatem z $env:CERT_FILE ($expected)."
            exit 1
          }
          if ($cert.NotAfter -lt (Get-Date)) { Write-Error "Certyfikat wygasł $($cert.NotAfter)."; exit 1 }
          Write-Host "Podpis: $($cert.Subject), odcisk $($cert.Thumbprint), ważny do $($cert.NotAfter.ToString("yyyy-MM-dd"))"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV

      - name: Podpis cyfrowy aplikacji
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # własne pliki programu (biblioteki .NET i NuGet mają swoje podpisy lub ich nie potrzebują)
          $files = @("out\app\DeskVac.exe", "out\app\DeskVac.dll")
          & $env:SIGNTOOL sign /f $env:PFX_PATH /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "DeskVac" @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalator (Inno Setup, podpisany razem z deinstalatorem)
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Inno Setup sam podpisuje DeskVac-Setup.exe i deinstalator ($f = plik, $q = cudzysłów)
          $sign = "`$q$($env:SIGNTOOL)`$q sign /f `$q$($env:PFX_PATH)`$q /p `$q$($env:PFX_PASS)`$q /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d `$qDeskVac - instalator`$q `$f"
          & $iscc "/DAppVersion=$env:DESKVAC_VERSION" "/DSign=1" "/Sdeskvacsign=$sign" deskvac\installer\DeskVac.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sprawdzenie podpisów
        shell: pwsh
        run: |
          $expected = (New-Object Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path $env:CERT_FILE).Path)).Thumbprint
          $bad = 0
          foreach ($f in "out\app\DeskVac.exe", "out\app\DeskVac.dll", "out\DeskVac-Setup.exe") {
            $s = Get-AuthenticodeSignature $f
            $ok = $s.SignerCertificate -and $s.SignerCertificate.Thumbprint -eq $expected -and $s.TimeStamperCertificate
            # certyfikat VERME jest samodzielnie wystawiony – na maszynie CI nie jest zaufany, stąd UnknownError zamiast Valid
            Write-Host ("{0,-28} {1,-14} {2} znacznik czasu: {3}" -f $f, $s.Status, $s.SignerCertificate.Thumbprint, [bool]$s.TimeStamperCertificate)
            if (-not $ok -or $s.Status -notin 'Valid', 'UnknownError') { $bad++ }
          }
          Remove-Item $env:PFX_PATH -Force -ErrorAction SilentlyContinue
          if ($bad) { Write-Error "$bad plik(ów) bez poprawnego podpisu VERME."; exit 1 }

      - name: Instalator DeskVac-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: DeskVac-Setup
          path: out/DeskVac-Setup.exe
          if-no-files-found: error

      - name: Wersja przenośna (folder)
        uses: actions/upload-artifact@v4
        with:
          name: DeskVac-portable-win-x64
          path: out/app/
          if-no-files-found: error
